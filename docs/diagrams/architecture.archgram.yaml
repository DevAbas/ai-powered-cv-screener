archgram: 1
title: How an answer comes to be
description: >-
  Before use, npm run index reads each CV PDF, splits its text into section
  chunks and has Gemini extract one profile; the field check keeps only the
  fields found in the CV's text, each with its page, and writes the profile
  and chunks to data/index. Each chunk is then embedded and stored in
  Pinecone. At question time the chat screen posts the question to
  /api/ask. The answer model reads no CV text: it calls the exact tools
  (find, count and get candidates) over the in-memory index, or
  search_cv_text, which embeds the query and fuses Pinecone's vector
  matches with BM25 over the same chunks. The model ends with a present
  call; the answer check refuses any candidate no tool returned, corrects
  any page no tool cited, and builds the view and its opening sentence from
  the tool results before the answer streams back to the chat screen.
direction: down
